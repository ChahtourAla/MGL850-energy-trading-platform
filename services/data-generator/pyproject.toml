
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2p-energy-data-generator"
version = "1.0.0"
description = "Synthetic energy data generator for the P2P Energy Trading Platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12,<3",
    "p2p-energy-shared==1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data_generator*"]
